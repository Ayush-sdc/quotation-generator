<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mycelium Dynamics | Quotations</title>

    <link rel="icon" type="image/png" href="assets/fevicon.png">
    <style>
        /* Spotify Design Variables */
        :root {
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ED760;
            --spotify-bg: #121212;
            --spotify-card: #181818;
            --spotify-input: #282828;
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: var(--spotify-bg);
            color: var(--text-main);
            padding: 40px 20px; 
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--spotify-card);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h2 { margin-top: 0; font-size: 28px; letter-spacing: -0.5px; }
        h3 { margin-top: 30px; font-size: 18px; border-bottom: 1px solid #282828; padding-bottom: 10px; color: var(--text-muted);}

        .form-group { margin-bottom: 20px; }
        
        .form-group label { 
            display: block; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            box-sizing: border-box; 
            background-color: var(--spotify-input);
            border: 1px solid transparent;
            color: var(--text-main);
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border: 1px solid #727272;
            background-color: #333333;
        }

        input::placeholder { color: #727272; }

        /* Color Picker for Date Input icon in dark mode */
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }

        /* Line Items Styling */
        .item-row { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 12px; 
            align-items: center; 
            background-color: #202020;
            padding: 10px;
            border-radius: 6px;
        }
        
        .item-row input { flex: 1; }
        .item-row .short-input { flex: 0.4; }
        
        .remove-btn { 
            background: transparent; 
            color: var(--text-muted); 
            border: none; 
            font-size: 18px;
            font-weight: bold;
            cursor: pointer; 
            padding: 10px;
            transition: color 0.2s;
        }
        .remove-btn:hover { color: #ff4d4d; }

        /* Spotify Pill Buttons */
        .add-btn { 
            background: transparent; 
            color: var(--text-main); 
            border: 1px solid #727272; 
            padding: 8px 24px; 
            font-size: 13px;
            font-weight: bold;
            cursor: pointer; 
            border-radius: 500px; /* Perfect pill shape */
            margin-bottom: 30px;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .add-btn:hover { border-color: var(--text-main); transform: scale(1.02); }

        .generate-btn { 
            background-color: var(--spotify-green); 
            color: var(--spotify-bg); 
            border: none; 
            padding: 16px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer; 
            border-radius: 500px; 
            transition: all 0.2s ease;
        }
        .generate-btn:hover { 
            background-color: var(--spotify-green-hover); 
            transform: scale(1.01); 
        }
        .generate-btn:disabled {
            background-color: #535353;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generate Quotation</h2>

        <div class="form-group">
            <label>Client Name (Invoice To)</label>
            <input type="text" id="clientName" placeholder="e.g., Grabbo & Co.">
        </div>
        
        <div class="form-group">
            <label>Quotation Ref (Invoice ID)</label>
            <input type="text" id="invoiceId" placeholder="e.g., Q-MD-20260903">
        </div>

        <div class="form-group">
            <label>Date</label>
            <input type="date" id="invoiceDate">
        </div>

        <h3>Price Breakdown</h3>
        <div id="line-items-container">
            <div class="item-row">
                <input type="text" class="category" placeholder="Project Category" value="Fullstack Website">
                <input type="text" class="description" placeholder="Description (e.g., Cloud cost)">
                <input type="number" class="qty short-input" placeholder="Qty" value="1">
                <input type="number" class="rate" placeholder="Cost (Rs)">
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()" title="Remove Item">✕</button>
            </div>
        </div>

        <button type="button" class="add-btn" onclick="addRow()">+ Add Item</button>

        <button type="button" class="generate-btn" onclick="generatePDF()">Generate PDF</button>
    </div>

    <script>
        document.getElementById('invoiceDate').valueAsDate = new Date();

        function addRow() {
            const container = document.getElementById('line-items-container');
            const row = document.createElement('div');
            row.className = 'item-row';
            
            const firstCategory = document.querySelector('.category')?.value || '';

            row.innerHTML = `
                <input type="text" class="category" placeholder="Project Category" value="${firstCategory}">
                <input type="text" class="description" placeholder="Description">
                <input type="number" class="qty short-input" placeholder="Qty" value="1">
                <input type="number" class="rate" placeholder="Cost (Rs)">
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()" title="Remove Item">✕</button>
            `;
            container.appendChild(row);
        }

        async function generatePDF() {
            const btn = document.querySelector('.generate-btn');
            btn.innerText = "Compiling PDF...";
            btn.disabled = true;

            try {
                const projects = [];
                document.querySelectorAll('.item-row').forEach(row => {
                    projects.push({
                        category: row.querySelector('.category').value || "General",
                        description: row.querySelector('.description').value || "Item",
                        qty: parseInt(row.querySelector('.qty').value) || 1,
                        rate: parseFloat(row.querySelector('.rate').value) || 0
                    });
                });

                const payload = {
                    client_name: document.getElementById('clientName').value || "Client",
                    invoice_id: document.getElementById('invoiceId').value || "REF-001",
                    invoice_date: document.getElementById('invoiceDate').value,
                    projects: projects 
                };

                // 🛑 CRITICAL: PASTE YOUR LIVE RENDER URL HERE BEFORE PUSHING TO GITHUB 🛑
                const response = await fetch("https://quotation-generator-xxxx.onrender.com/generate-pdf", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Server Error");
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Quotation_${payload.invoice_id}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

            } catch (error) {
                console.error(error);
                alert("Failed to generate PDF: " + error.message);
            } finally {
                btn.innerText = "Generate PDF";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
