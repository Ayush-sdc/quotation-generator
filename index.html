<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        
        /* Styling for the dynamic line items */
        .item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .item-row input { flex: 1; padding: 8px; }
        .item-row .short-input { flex: 0.5; }
        .remove-btn { background: #ff4d4d; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .add-btn { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; margin-bottom: 20px;}
        .generate-btn { background: #28a745; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Generate Quotation</h2>

    <div class="form-group">
        <label>Client Name (Invoice To)</label>
        <input type="text" id="clientName" placeholder="e.g., Grabbo & Co.">
    </div>
    
    <div class="form-group">
        <label>Quotation Ref (Invoice ID)</label>
        <input type="text" id="invoiceId" placeholder="e.g., Q-MD-20260903">
    </div>

    <div class="form-group">
        <label>Date</label>
        <input type="date" id="invoiceDate">
    </div>

    <h3>Price Breakdown</h3>
    <div id="line-items-container">
        <!-- The first default row -->
        <div class="item-row">
            <input type="text" class="category" placeholder="Project (e.g., Fullstack Website)" value="Fullstack Website">
            <input type="text" class="description" placeholder="Description (e.g., Cloud cost)">
            <input type="number" class="qty short-input" placeholder="Qty" value="1">
            <input type="number" class="rate" placeholder="Cost (Rs) e.g., 2000">
            <button type="button" class="remove-btn" onclick="this.parentElement.remove()">X</button>
        </div>
    </div>

    <button type="button" class="add-btn" onclick="addRow()">+ Add Breakdown Description</button>

    <button type="button" class="generate-btn" onclick="generatePDF()">Generate PDF</button>

    <script>
        // Auto-fill today's date
        document.getElementById('invoiceDate').valueAsDate = new Date();

        // Function to dynamically add new rows for the price breakdown
        function addRow() {
            const container = document.getElementById('line-items-container');
            const row = document.createElement('div');
            row.className = 'item-row';
            
            // Copies the category from the first row to save typing, but allows it to be changed
            const firstCategory = document.querySelector('.category')?.value || '';

            row.innerHTML = `
                <input type="text" class="category" placeholder="Project" value="${firstCategory}">
                <input type="text" class="description" placeholder="Description (e.g., Website maintenance)">
                <input type="number" class="qty short-input" placeholder="Qty" value="1">
                <input type="number" class="rate" placeholder="Cost (Rs)">
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        // Function to gather all data and send to backend
        async function generatePDF() {
            const btn = document.querySelector('.generate-btn');
            btn.innerText = "Compiling PDF...";
            btn.disabled = true;

            try {
                // Scrape all the dynamically generated rows
                const projects = [];
                document.querySelectorAll('.item-row').forEach(row => {
                    projects.push({
                        category: row.querySelector('.category').value || "General",
                        description: row.querySelector('.description').value || "Item",
                        qty: parseInt(row.querySelector('.qty').value) || 1,
                        rate: parseFloat(row.querySelector('.rate').value) || 0
                    });
                });

                const payload = {
                    client_name: document.getElementById('clientName').value || "Client",
                    invoice_id: document.getElementById('invoiceId').value || "REF-001",
                    invoice_date: document.getElementById('invoiceDate').value,
                    projects: projects // This array is what Jinja2 loops through!
                };

                // Remember to change this URL back to your Render URL when deploying to the cloud!
                // CORRECT: Points directly to the POST route
                const response = await fetch("https://quotation-generator-dn32.onrender.com/generate-pdf",{
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Server Error");
                }

                // Handle the binary PDF stream and trigger download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Quotation_${payload.invoice_id}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

            } catch (error) {
                console.error(error);
                alert("Failed to generate PDF: " + error.message);
            } finally {
                btn.innerText = "Generate PDF";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
